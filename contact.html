<script>
  // hero: plays once, immediately on load, independent of scroll position
  var heroEls = document.querySelectorAll('.hero .r');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      heroEls.forEach(function(el){ el.classList.add('in'); });
    });
  });

  // everything below the hero: reveals as it enters the viewport
  var els = document.querySelectorAll('.r:not(.hero .r)');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('in'); });
  }
</script>
