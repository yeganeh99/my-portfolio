<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yelena Ghasemi — Product &amp; UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap" rel="stylesheet">
<script>
(function(r){try{if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches&&typeof r.animate==="function"){r.classList.add("px-intro");window.__pxFailsafe=setTimeout(function(){r.classList.remove("px-intro")},4000)}}catch(e){}})(document.documentElement);
</script>
<style>
@font-face{font-family:"PX Mono";font-weight:400;font-display:block;src:url(assets/px-mono-400.woff2) format("woff2")}
@font-face{font-family:"PX Mono";font-weight:500;font-display:block;src:url(assets/px-mono-500.woff2) format("woff2")}
@font-face{font-family:"PX Sans";font-weight:400;font-display:block;src:url(assets/px-sans-400.woff2) format("woff2")}
@font-face{font-family:"PX Sans";font-weight:700;font-display:block;src:url(assets/px-sans-700.woff2) format("woff2")}
:root{
--bg:#101010;
--ink:#ffffff;
--panel:#000000;
--vw:100vw; --vh:100vh;
--sc:max(calc(var(--vw) / 1280), calc(var(--vh) / 800));
--u:clamp(.72px, min(calc(var(--vw) / 1280), calc(var(--vh) / 800)), 3px);
--mono:"Hina Mincho",serif;
--sans:"Hina Mincho",serif;
}
@supports (height:100dvh){ :root{ --vh:100dvh; } }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision}
body{position:relative;width:100%;min-height:100%;color:var(--ink);font-family:"Hina Mincho",serif}
.stage{position:relative;width:100%;height:var(--vh);min-height:480px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;left:50%;top:50%;width:calc(1280 * var(--sc));height:calc(800 * var(--sc));transform:translate(-50%,-50%)}
.scene>video{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;object-fit:cover}
.scene::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 30%,transparent 70%,rgba(0,0,0,.42)),rgba(0,0,0,.2);pointer-events:none}
.ui{position:absolute;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.copy{position:absolute;font:400 calc(14 * var(--u))/calc(17.5 * var(--u)) var(--mono);letter-spacing:-0.025em;color:var(--ink);text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.copy--tl{left:calc(34.5 * var(--u));top:calc(46.6 * var(--u))}
.copy--tr{right:calc(45 * var(--u));top:calc(39 * var(--u));text-align:right}
.copy--bl{left:calc(34.5 * var(--u));bottom:calc(39.5 * var(--u))}
.copy--br{right:calc(45 * var(--u));bottom:calc(39.5 * var(--u));text-align:right}
.copy{transition:opacity .3s ease,visibility .3s ease}
.pill-links-visible .copy--tl,.pill-links-visible .copy--tr{visibility:hidden;opacity:0}
.title{position:absolute;left:50%;z-index:3;width:max-content;top:calc(378 * var(--sc));transform:translateX(-50%);
font:400 calc(48 * var(--sc))/1 var(--sans);font-kerning:none;letter-spacing:-0.01em;color:#000;text-align:center;white-space:nowrap;opacity:0;translate:0 12px;transition:opacity .7s ease,translate .7s cubic-bezier(.16,1,.3,1)}
.title span{display:inline-block;margin-left:calc(var(--k,0) * var(--sc))}
.title-subtitle{position:absolute;left:50%;z-index:3;top:calc(378 * var(--sc) + 48 * var(--sc) + 20px);width:max-content;transform:translateX(-50%);color:#000;font:400 calc(48 * var(--sc))/1.2 var(--sans);text-align:center;white-space:nowrap;opacity:0;translate:0 12px;transition:opacity .7s ease .12s,translate .7s cubic-bezier(.16,1,.3,1) .12s}
.hero-copy-visible .title,.hero-copy-visible .title-subtitle{opacity:1;translate:0 0}
.pill-links{position:absolute;inset:0;z-index:2;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .3s ease,visibility .3s}
.pill-links.is-visible{visibility:visible;opacity:1}
.pill-link{position:absolute;top:6.25%;width:18.4%;height:14.5%;display:flex;align-items:center;justify-content:center;padding:0 1%;color:#202020;
font:500 calc(28 * var(--u))/1.15 var(--mono);letter-spacing:-0.04em;text-align:center;text-decoration:none;text-shadow:0 1px 5px rgba(255,255,255,.9);pointer-events:auto}
.pill-link:nth-child(1){left:17%}
.pill-link:nth-child(2){left:40.3%}
.pill-link:nth-child(3){left:64.5%}
.pill-link:hover{color:#000;text-shadow:0 1px 6px #fff}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (orientation:portrait) and (min-width:561px){ :root{ --u:clamp(.72px, calc(var(--vw) / 860), 1.6px); } }
@media (max-width:560px){
:root{ --u:clamp(.72px, calc(var(--vw) / 470), 1px); }
.copy--tl{left:calc(20 * var(--u));top:calc(96 * var(--u))}
.copy--tr{right:calc(20 * var(--u));top:calc(96 * var(--u))}
.copy--bl{left:calc(20 * var(--u));bottom:calc(24 * var(--u))}
.copy--br{right:calc(20 * var(--u));bottom:calc(24 * var(--u))}
.pill-links{inset:auto;top:12%;left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px}
.pill-link,.pill-link:nth-child(n){position:relative;top:auto;left:auto;width:auto;height:64px;padding:6px;border:0;border-radius:20px;background:transparent;color:#fff;font-size:18px;letter-spacing:-0.02em;text-shadow:none}
.pill-link:hover{color:#fff;background:rgba(0,0,0,.82);text-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ln{display:block}
.ln>span{display:inline-block}
.px-intro .ln{overflow:hidden}
.px-intro .ln>span{translate:0 105%}
.project-form{min-height:100vh;padding:clamp(48px,8vw,112px) 24px;background:#24343c;color:var(--ink)}
.project-form__inner{width:min(100%,600px);margin:0 auto}
.project-form h2{margin-bottom:32px;font:400 clamp(26px,4vw,42px)/1.1 var(--sans)}
.project-form form{display:grid;gap:12px}
.project-form label{font:400 14px/1.4 "Hina Mincho",serif;letter-spacing:-0.025em;text-transform:uppercase}
.project-form input,.project-form textarea{width:100%;padding:14px;border:1px solid rgba(255,255,255,.45);border-radius:0;background:transparent;color:var(--ink);font:400 15px/1.5 "Hina Mincho",serif}
.project-form input::placeholder,.project-form textarea::placeholder{color:rgba(255,255,255,.65)}
.project-form input[type="submit"]{width:auto;justify-self:start;margin-top:8px;padding:14px 22px;background:#000;cursor:pointer;text-transform:uppercase}
.project-form input[type="submit"]:hover{background:#fff;color:#000}
@media(max-width:560px){.project-form{padding:56px 20px}}
</style>
</head>
<body>
<main class="stage">
<div class="scene" aria-hidden="false">
<video class="hero-video" loop muted playsinline preload="auto" aria-hidden="true">
<source src="Img/glass-circle-split.mp4" type="video/mp4">
</video>

<h1 class="title" aria-label="Yelena Ghasemi"><span aria-hidden="true" style="--k:0">Y</span><span aria-hidden="true" style="--k:0">E</span><span aria-hidden="true" style="--k:0">L</span><span aria-hidden="true" style="--k:0">E</span><span aria-hidden="true" style="--k:0">N</span><span aria-hidden="true" style="--k:0">A</span><span aria-hidden="true" style="--k:24">G</span><span aria-hidden="true" style="--k:0">H</span><span aria-hidden="true" style="--k:0">A</span><span aria-hidden="true" style="--k:0">S</span><span aria-hidden="true" style="--k:0">E</span><span aria-hidden="true" style="--k:0">M</span><span aria-hidden="true" style="--k:0">I</span></h1>
<p class="title-subtitle">UX Designer</p>
</div>
<div class="ui">
<p class="copy copy--tl"><span class="ln"><span>Product &amp; UX</span></span><span class="ln"><span>Designer.</span></span></p>
<p class="copy copy--tr"><span class="ln"><span>Thoughtful digital</span></span><span class="ln"><span>experiences shaped</span></span><span class="ln"><span>around people.</span></span></p>
<nav class="pill-links" aria-label="Primary navigation">
<a class="pill-link" href="contact.html"><span>Get In Touch</span></a>
<a class="pill-link" href="Resume.html"><span>View My Work</span></a>
<a class="pill-link" href="Resume.html"><span>My Resume</span></a>
</nav>
<p class="copy copy--bl"><span class="ln"><span>Strategy meets</span></span><span class="ln"><span>user-first design.</span></span></p>
<p class="copy copy--br"><span class="ln"><span>Ideas shaped</span></span><span class="ln"><span>into impact.</span></span></p>
</div>
</main>
<section class="project-form" id="form">
<div class="project-form__inner">
<h2>Tell me about your project</h2>
<form action="/Submit_form" method="post">
<label for="name">First name</label>
<input type="text" id="name" name="name" autocomplete="given-name" required placeholder="Enter your first name">
<label for="familyname">Last name</label>
<input type="text" id="familyname" name="familyname" autocomplete="family-name" required placeholder="Enter your last name">
<label for="companyname">Company name</label>
<input type="text" id="companyname" name="companyname" autocomplete="organization" required placeholder="Enter your company name">
<label for="email">Organization email</label>
<input type="email" id="email" name="email" autocomplete="email" required placeholder="Enter your organization email">
<label for="linkedinaddress">LinkedIn address</label>
<input type="url" id="linkedinaddress" name="linkedinaddress" autocomplete="url" required placeholder="https://www.linkedin.com/in/your-profile">
<label for="projectsummary">Project description</label>
<textarea id="projectsummary" name="projectsummary" rows="5" required placeholder="Describe your project"></textarea>
<input type="submit" id="submit" name="submit" value="Submit request">
</form>
</div>
</section>
<script>
(function(){
var root=document.documentElement;
var video=document.querySelector(".hero-video");
var pillLinks=document.querySelector(".pill-links");
var motion=matchMedia("(prefers-reduced-motion: reduce)");
function updatePillLinks(){
var visible=motion.matches||video.currentTime>=8.9;
pillLinks.classList.toggle("is-visible",visible);
root.classList.toggle("pill-links-visible",visible);
}
function updateHeroCopy(){
if(motion.matches||video.currentTime>=8.9) root.classList.add("hero-copy-visible");
}
function updateVideo(){
if(motion.matches){
video.pause();
if(video.readyState>=1&&video.currentTime<8.9) video.currentTime=9.5;
updatePillLinks();
updateHeroCopy();
return
}
var playback=video.play();
if(playback&&playback.catch) playback.catch(function(){video.controls=true});
}
video.addEventListener("timeupdate",function(){updatePillLinks();updateHeroCopy()});
video.addEventListener("seeked",updatePillLinks);
video.addEventListener("seeked",updateHeroCopy);
video.addEventListener("loadedmetadata",updateVideo);
updateVideo();
if(motion.addEventListener) motion.addEventListener("change",updateVideo);
if(!root.classList.contains("px-intro")) return;
var EXPO ="cubic-bezier(.16,1,.3,1)",
SOFT ="cubic-bezier(.25,1,.5,1)";
var narrow=matchMedia("(max-width:560px)").matches;
var S=narrow?.8:1;
var anims=[];
function $(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function add(el,kf,o){o.fill="both";anims.push(el.animate(kf,o))}
function play(){
function lines(sel,start){
$(sel+" .ln>span").forEach(function(s,i){
add(s,[{translate:"0 105%"},{translate:"0 0"}],{duration:800,delay:start+i*70*S,easing:EXPO});
});
}
lines(".copy--tl",700); lines(".copy--tr",760);
lines(".copy--bl",1100); lines(".copy--br",1160);
clearTimeout(window.__pxFailsafe);
Promise.all(anims.map(function(a){return a.finished})).then(function(){
root.classList.remove("px-intro");
anims.forEach(function(a){a.cancel()});
anims.length=0;
});
}
var ready=document.fonts?document.fonts.ready:Promise.resolve();
var started=false;
function go(){ if(started) return; started=true; requestAnimationFrame(play); }
ready.then(go,go); setTimeout(go,1200);
})();
</script>
</body>
</html>
