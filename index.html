<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  :root{
    --bg:#F2F3F1;
    --bg-deep:#eeeeee;
    
    --fg:#0b142c;
    --fg-secondary: #102254;
    --fg-tertiary: #83A1D3;
    --line: #9EC9E2;
    --accent:#A78350;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    --font-display: 'Iowan Old Style', 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif;

    --text-micro: clamp(0.72rem, 0.7rem + 0.1vw, 0.78rem);
    --text-sm: clamp(0.88rem, 0.85rem + 0.15vw, 0.95rem);
    --text-base: clamp(1rem, 0.96rem + 0.2vw, 1.08rem);
    --text-lg: clamp(1.3rem, 1.15rem + 0.7vw, 1.7rem);
    --text-xl: clamp(1.9rem, 1.5rem + 1.8vw, 2.8rem);
    --text-display: clamp(3.2rem, 1.6rem + 8vw, 8.4rem);

    --margin: clamp(1.25rem, 4vw, 5rem);
    --content-max: 1440px;
  }

  /* FULL SCREEN HOME IMAGE */
  #home {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    background-image: url('Img/me.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
    background-repeat: no-repeat !important;
  }

  #home img {
    display: none !important;
  }

  #home h1,
  #home h2 {
    position: relative !important;
    z-index: 5 !important;
    color: white !important;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5) !important;
    margin: 10px !important;
  }

  header {
    position: fixed !important;
    top: 0 !important;
    width: 100% !important;
    z-index: 10 !important;
  }

  body {
    margin: 0 !important;
    padding: 0 !important;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:var(--text-base);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }

  ::selection{ background:var(--accent); color:var(--bg); }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  .wrap{
    max-width:var(--content-max);
    margin:0 auto;
    padding-left:var(--margin);
    padding-right:var(--margin);
  }

  h1,h2,h3{
    font-family:var(--font-display);
    font-weight:400;
    margin:0;
    letter-spacing:-0.01em;
  }
  p{ margin:0; }

  /* ---------- atmosphere ---------- */
  .atmosphere{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .atmosphere span{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,231,208,0.5) 0%, rgba(255,231,208,0) 70%);
  }
  .atmosphere span:nth-child(1){
    width:60vw; height:60vw; top:-20vw; left:-10vw;
    filter:blur(100px); opacity:0.05;
  }
  .atmosphere span:nth-child(2){
    width:45vw; height:45vw; bottom:-15vw; right:-10vw;
    filter:blur(90px); opacity:0.05;
    background:radial-gradient(circle, rgba(252,110,32,0.6) 0%, rgba(252,110,32,0) 70%);
  }
  .atmosphere span:nth-child(3){
    width:30vw; height:30vw; top:40vh; left:50vw;
    filter:blur(80px); opacity:0.03;
  }

  main, header, footer{ position:relative; z-index:1; }

  /* ---------- reveal ---------- */
  .r{
    opacity:0;
    transform:translateY(20px);
    filter:blur(3px);
    transition: opacity 900ms var(--ease), transform 900ms var(--ease), filter 700ms var(--ease);
  }
  .r.in{ opacity:1; transform:translateY(0); filter:blur(0); }

  /* hero: staggered cinematic load-in, distinct from the generic scroll reveal */
  .hero-kicker.r{ transform:translateY(10px); transition-delay: 80ms; }
  .hero h1.r{ transform:translateY(26px); filter:blur(5px); transition-delay: 220ms; transition-duration: 1100ms; }
  .hero-photo-wrap.r{
    transform: translate(22vw, -16vh) scale(0.82);
    filter:blur(6px);
    transition-delay: 300ms;
    transition-duration: 1300ms;
  }
  .hero-photo-wrap.r.in{ transform:translate(0,0) scale(1); filter:blur(0); }
  .hero-lede.r{ transition-delay: 520ms; }
  .hero-meta.r{ transition-delay: 680ms; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .r{ opacity:1; transform:none; filter:none; transition:none; }
  }

  /* ---------- header ---------- */
  header{
    padding-top:1.6rem;
    padding-bottom:1.6rem;
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .nav-name{
    font-family:var(--font-display);
    font-size:var(--text-lg);
    color:var(--fg);
    text-decoration:none;
  }
  .nav-links{
    display:flex;
    gap:2.4rem;
    list-style:none;
    margin:0; padding:0;
    font-size:var(--text-micro);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .nav-links a{
    text-decoration:none;
    opacity:0.55;
    transition:opacity 300ms ease;
  }
  .nav-links a:hover, .nav-links a:focus-visible{ opacity:1; color:var(--accent); }
  .nav-links a:focus-visible{ outline:1px solid var(--fg); outline-offset:4px; }

  /* ---------- hero ---------- */
  .hero{
    padding-top: clamp(4rem, 12vw, 9rem);
    padding-bottom: clamp(4rem, 10vw, 8rem);
  }
  .hero-kicker{
    font-size:var(--text-micro);
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:1.6rem;
  }
  .hero-visual{
    position:relative;
  }
  .hero h1{
    font-size:var(--text-display);
    line-height:0.98;
    max-width:15ch;
    color:var(--fg);
    font-weight:400;
  }
  .hero h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--accent);
  }
  .hero-photo-wrap{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100vw;
    height:100vh;
    z-index:0;
  }
  .hero-photo{
    width:100%; height:100%;
    border-radius: 0;
    overflow:hidden;
    box-shadow: none;
    animation: none;
  }
  .hero-photo img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .hero-tag{
    position:absolute;
    left:50%;
    bottom:-12%;
    transform:translateX(-50%);
    z-index:3;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--fg);
    font-size:var(--text-micro);
    letter-spacing:0.03em;
    white-space:nowrap;
    padding:0.55rem 1.1rem;
    border-radius:999px;
  }
  .hero-tag span{ color:var(--fg-tertiary); }

  @keyframes float{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-14px); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-photo{ animation:none; }
  }
  .hero-cols{
    margin-top:clamp(3rem, 8vw, 6rem);
    display:grid;
    grid-template-columns: repeat(12, 1fr);
    gap:1.5rem;
  }
  .hero-lede{
    grid-column: 1 / 7;
    font-size:var(--text-lg);
    font-family:var(--font-display);
    color:var(--fg);
    max-width:32ch;
  }
  .hero-meta{
    grid-column: 9 / 13;
    display:flex;
    flex-direction:column;
    gap:1rem;
    font-size:var(--text-sm);
    color:var(--fg-tertiary);
    border-top:1px solid var(--line);
    padding-top:1.2rem;
  }
  .hero-meta strong{ color:var(--fg-secondary); font-weight:400; display:block; font-size:var(--text-micro); letter-spacing:0.04em; text-transform:uppercase; margin-bottom:0.15rem; }

  /* ---------- section shell ---------- */
  section{
    padding-top:clamp(4rem, 9vw, 8rem);
    padding-bottom:clamp(4rem, 9vw, 8rem);
    border-top:1px solid var(--line);
  }
  .section-head{
    display:grid;
    grid-template-columns: repeat(12, 1fr);
    gap:1.5rem;
    margin-bottom:clamp(3rem, 7vw, 6rem);
  }
  .section-index{
    grid-column: 1 / 2;
    font-size:var(--text-micro);
    color:var(--fg-tertiary);
    letter-spacing:0.04em;
  }
  .section-head h2{
    grid-column: 2 / 8;
    font-size:var(--text-xl);
    color:var(--fg);
  }
  .section-copy{
    grid-column: 9 / 13;
    font-size:var(--text-sm);
    color:var(--fg-secondary);
  }

  /* ---------- work ---------- */
  .project{
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    gap:1.5rem;
    padding-bottom:clamp(4rem, 9vw, 7rem);
  }
  .project + .project{
    border-top:1px solid var(--line);
    padding-top:clamp(4rem, 9vw, 7rem);
  }

  .project-index{
    grid-column: 1 / 2;
    font-size:var(--text-micro);
    color:var(--fg-tertiary);
    padding-top:0.3rem;
  }
  .project-head{
    grid-column: 2 / 8;
  }
  .project-title{
    font-size:var(--text-xl);
    color:var(--fg);
    max-width:14ch;
  }
  .project-tags{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem 1.1rem;
    margin-top:1.4rem;
    font-size:var(--text-micro);
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--fg-tertiary);
  }

  .project-body{
    grid-column: 9 / 13;
    color:var(--fg-secondary);
    font-size:var(--text-sm);
  }
  .project-body p + p{ margin-top:1rem; }
  .project-body h4{
    font-family:var(--font-body);
    font-size:var(--text-micro);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:500;
    color:var(--fg-tertiary);
    margin-top:1.8rem;
    margin-bottom:0.5rem;
  }

  .screens{
    grid-column: 2 / 13;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    align-items:start;
    gap:1.2rem;
    margin-top:clamp(2.5rem, 6vw, 4rem);
  }
  .screen{
    overflow:hidden;
    background:var(--panel);
    position:relative;
    border-radius: 14px;
  }
  .screen img{
    width:100%;
    height:auto;
    display:block;
    transform:scale(1);
    filter:blur(0);
    transition: transform 900ms var(--ease), filter 700ms ease;
  }
  .screen:hover img{ transform:scale(1.025); }

  .placeholder-note{
    grid-column: 2 / 13;
    font-size:var(--text-micro);
    color:var(--fg-tertiary);
    margin-top:1.2rem;
    font-style:italic;
  }

  /* ---------- about ---------- */
  .about-grid{
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    gap:1.5rem;
  }
  .about-lede{
    grid-column: 1 / 8;
    font-family:var(--font-display);
    font-size:var(--text-xl);
    color:var(--fg);
    max-width:18ch;
    margin-bottom:clamp(2.5rem, 6vw, 4rem);
  }
  .about-text{
    grid-column: 1 / 7;
    color:var(--fg-secondary);
    font-size:var(--text-sm);
  }
  .about-text.b{ grid-column: 8 / 13; }
  .about-text p + p{ margin-top:1rem; }

  /* ---------- skills ---------- */
  .skills-list{
    grid-column: 2 / 13;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1.5rem 1.5rem;
    list-style:none;
    margin:0; padding:0;
  }
  .skills-list li{
    border-top:1px solid var(--line);
    padding-top:0.9rem;
    font-size:var(--text-sm);
    color:var(--fg-secondary);
  }

  /* ---------- experience ---------- */
  .timeline{
    grid-column: 2 / 13;
  }
  .entry{
    display:grid;
    grid-template-columns: 11rem 1fr 1fr;
    gap:1.5rem;
    padding:1.8rem 0;
    border-top:1px solid var(--line);
    align-items:baseline;
  }
  .timeline .entry:last-child{ border-bottom:1px solid var(--line); }
  .entry-period{
    font-size:var(--text-micro);
    color:var(--fg-tertiary);
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .entry-role{
    font-size:var(--text-lg);
    font-family:var(--font-display);
    color:var(--fg);
  }
  .entry-org{
    font-size:var(--text-sm);
    color:var(--fg-secondary);
  }

  /* ---------- contact ---------- */
  .contact{ border-top:1px solid var(--line); }
  .contact h2{
    font-size:var(--text-display);
    line-height:0.98;
    max-width:14ch;
    color:var(--fg);
  }
  .contact-row{
    display:grid;
    grid-template-columns:repeat(12, 1fr);
    gap:1.5rem;
    margin-top:clamp(3rem, 7vw, 6rem);
    border-top:1px solid var(--line);
    padding-top:1.6rem;
  }
  .contact-links{
    grid-column: 1 / 5;
    display:flex;
    flex-direction:column;
    gap:0.8rem;
    list-style:none;
    margin:0; padding:0;
    font-size:var(--text-base);
  }
  .contact-links a{
    text-decoration:none;
    opacity:0.7;
    transition:opacity 300ms ease;
  }
  .contact-links a:hover{ opacity:1; color:var(--accent); }
  .contact-note{
    grid-column: 8 / 13;
    font-size:var(--text-sm);
    color:var(--fg-tertiary);
    max-width:34ch;
  }

  footer{ padding:2.5rem 0; }
  .footer-row{
    display:flex;
    justify-content:space-between;
    font-size:var(--text-micro);
    color:var(--fg-tertiary);
    letter-spacing:0.03em;
    text-transform:uppercase;
  }

  a:focus-visible, button:focus-visible{
    outline:1px solid var(--fg);
    outline-offset:3px;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 900px){
    .hero h1{ max-width:12ch; }
    .hero-photo-wrap{
      position:static;
      margin:2.5rem auto 3rem;
      width:min(60vw, 280px);
    }
    .hero-lede{ grid-column:1/13; }
    .hero-meta{ grid-column:1/13; margin-top:2rem; }
    .section-head h2{ grid-column:1/13; }
    .section-copy{ grid-column:1/13; margin-top:1rem; }
    .project-head{ grid-column:1/13; }
    .project-body{ grid-column:1/13; margin-top:1.5rem; }
    .screens{ grid-column:1/13; grid-template-columns:repeat(2,1fr); }
    .placeholder-note{ grid-column:1/13; }
    .about-lede{ grid-column:1/13; }
    .about-text, .about-text.b{ grid-column:1/13; }
    .about-text.b{ margin-top:1.5rem; }
    .skills-list{ grid-column:1/13; grid-template-columns:repeat(2,1fr); }
    .timeline{ grid-column:1/13; }
    .entry{ grid-template-columns:1fr; gap:0.3rem; }
    .contact-links{ grid-column:1/13; }
    .contact-note{ grid-column:1/13; margin-top:1.5rem; }
    .nav-links{ gap:1.2rem; }
  }
  @media (max-width: 560px){
    .screens{ grid-template-columns:1fr 1fr; }
    .nav-links li:nth-child(3){ display:none; }
  }
</style>
</head>
<body>
<header>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="home">
  <img src="Img/me.jpg" alt="yeganeh's picture">
  <h1> Hi, I'm Yeganeh Ghasemi. </h1>

  </section>

    

      

  <section id="contact" class="contact">
    <div class="wrap">
      <h2 class="r">Let's talk about what you're building.</h2>
      <div class="contact-row">
        <ul class="contact-links r">
          <li><a href="mailto:Yeganehghasemi981@gmail.com">Email</a></li>
          <li><a href="tel:+12252667950">+1 225 266 7950</a></li>
          <li><a href="#">LinkedIn</a></li>
          <li><a href="#">Resume</a></li>
        </ul>
        <p class="contact-note r">Baton Rouge, LA — designing for remote teams, moving to Europe long-term.</p>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap footer-row">
    <span>Yeganeh</span>
    <span>Baton Rouge, LA</span>
  </div>
</footer>

<script>
  // hero: plays once, immediately on load, independent of scroll position
  var heroEls = document.querySelectorAll('.hero .r');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      heroEls.forEach(function(el){ el.classList.add('in'); });
    });
  });

  // everything below the hero: reveals as it enters the viewport
  var els = document.querySelectorAll('.r:not(.hero .r)');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('in'); });
  }
</script>

</body>
</html>
