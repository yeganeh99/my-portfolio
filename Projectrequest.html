    <h1>Fill out the form below to request a design project</h1>
<form action="/Submit_form" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required placeholder="Enter your name"><br><br>

<label for="familyname">Family Name:</label>
<input type="text" id="familyname" name="familyname" required placeholder="Enter your family name"><br><br>
<label for="Companyname">Company Name:</label>
<input type="text" id="Companyname" name="Companyname" required placeholder="Enter your company name"><br><br>
<label for="email"> Organization Email:</label>
<input type="email" id="email" name="email" required placeholder="Enter your organization email"><br><br>
<label for="linkedinaddress"> Linkedin Address:</label>
<input type="url" id="linkedinaddress" name="linkedinaddress" required placeholder="Enter your LinkedIn address"><br><br>
<label for="projectsummary">Project Description:</label>
<input type="text" id="projectsummary" name="projectsummary" required placeholder="Enter a brief description of your project"><br><br>

</form>
