<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
<header>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="Resume.html">Resume</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="Projectrequest.html">Project Request</a></li>
    </ul>
  </nav>
</header>
<main class="form elements">

    <h1>Fill out the form below to request a design project</h1>
<form action="/Submit_form" method="post">
    <label for="name">First name:</label>
    <input type="text" id="name" name="name" autocomplete="given-name" required placeholder="Enter your first name"><br><br>

<label for="familyname">Last name:</label>
<input type="text" id="familyname" name="familyname" autocomplete="family-name" required placeholder="Enter your last name"><br><br>
<label for="companyname">Company name:</label>
<input type="text" id="companyname" name="companyname" autocomplete="organization" required placeholder="Enter your company name"><br><br>
<label for="email">Organization email:</label>
<input type="email" id="email" name="email" autocomplete="email" required placeholder="Enter your organization email"><br><br>
<label for="linkedinaddress">LinkedIn address:</label>
<input type="url" id="linkedinaddress" name="linkedinaddress" autocomplete="url" required placeholder="https://www.linkedin.com/in/your-profile"><br><br>
<label for="projectsummary">Project Description:</label>
<textarea id="projectsummary" name="projectsummary" rows="5" required placeholder="Describe your project"></textarea><br><br>
<label for="submit">Submit Request</label>
<input type="submit" id="submit" name="submit" value="Submit Request"><br>
</form>

</main>


</body>
</html>
